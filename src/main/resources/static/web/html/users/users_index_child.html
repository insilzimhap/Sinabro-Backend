    // ✅ 공통 헤더 로드
    fetch("/web/header.html")
            .then(res => res.text())
            .then(data => {
              document.getElementById("header-container").innerHTML = data;
              checkLogin();
            });

    // ✅ URL 파라미터에서 childId 추출
    const params = new URLSearchParams(location.search);
    const childId = params.get("childId");

    if (!childId) {
      alert("잘못된 접근입니다.");
      window.location.href = "users_index.html";
    }

    // ✅ 자녀 상세 API 호출
    async function loadChildDetail() {
      try {
        const res = await apiFetch(`/api/admin/children/${encodeURIComponent(childId)}`);
        if (!res || !res.ok) {
          alert("자녀 정보를 불러오지 못했습니다.");
          return;
        }
        const data = await res.json();

        // 화면 채우기
        document.getElementById("child-title").innerText    = (data.name || "") + " 님";
        document.getElementById("child-age").innerText      = "나이: 만 " + (data.age ?? "-") + "세";
        document.getElementById("child-id").innerText       = data.childId ?? "";
        document.getElementById("child-nickname").innerText = data.nickname ?? "-";
        document.getElementById("child-level").innerText    = data.level ?? "-";
        document.getElementById("child-character").innerText = data.characterName ?? "-";


      } catch (e) {
        console.error(e);
        alert("자녀 정보를 불러오는 중 오류가 발생했습니다.");
      }
    }


    // ✅ 자녀 삭제
    async function deleteChild() {
      const params = new URLSearchParams(location.search);
      const childId = params.get("childId");
      if (!childId) {
        alert("잘못된 접근입니다.");
        return;
      }
      if (!confirm("정말 삭제하시겠습니까?")) return;

      const res = await apiFetch(`/api/admin/children/${encodeURIComponent(childId)}`, {
        method: "DELETE"
      });
      if (!res) return; // 로그인 리다이렉트 등 공통 처리

      if (res.status === 204) {
        alert("삭제되었습니다.");
        const parentUserId = new URLSearchParams(location.search).get("parentUserId");
        const back = parentUserId
                ? `/web/html/users/users_index_parent.html?userId=${encodeURIComponent(parentUserId)}`
                : `/web/html/users/users_index.html`;
        location.href = back;
      } else if (res.status === 404) {
        alert("대상 자녀를 찾을 수 없습니다.");
      } else {
        alert("삭제 중 오류가 발생했습니다.");
      }
    }

    // 첫 로딩 시 실행
    loadChildDetail();
